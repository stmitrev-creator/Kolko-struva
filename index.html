<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#35a85a"><meta name="apple-mobile-web-app-capable" content="yes"><title>Колко струва?</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--g:#35a85a;--bg:#f7f8f7;--muted:#737873}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#171a18}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:82px}.screen{display:none;padding:18px 16px}.screen.active{display:block}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:28px;margin:0}h2{font-size:21px}.search{width:100%;padding:14px;border:0;border-radius:15px;background:white;font-size:15px;box-shadow:0 1px 6px #0000000c}.chips{display:flex;gap:8px;overflow:auto;padding:13px 0}.chip{white-space:nowrap;padding:9px 13px;border-radius:22px;border:1px solid #e5e8e5;background:#fff}.chip.active{background:#eaf7ed;color:#18733a}.card{background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #00000008;border:1px solid #eceeec}.venue{display:flex;gap:12px;align-items:center}.thumb{width:76px;height:76px;border-radius:14px;background:#e5f3e8;display:grid;place-items:center;font-size:29px}.meta{font-size:13px;color:var(--muted);margin-top:4px}.star{color:#f5b51b}.verified{color:#21884a;font-size:12px;margin-top:7px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:#fff;border-top:1px solid #e6e8e6;display:flex;justify-content:space-around;z-index:5}.nav{border:0;background:none;color:#888;font-size:11px}.nav b{display:block;font-size:21px}.nav.active{color:var(--g);font-weight:700}.map{height:62vh;border-radius:20px;background:#dfe8df;position:relative;overflow:hidden}.road{position:absolute;background:white;height:13px;width:130%}.r1{top:42%;left:-10%;transform:rotate(-17deg)}.r2{top:60%;left:-8%;transform:rotate(23deg)}.pin{position:absolute;border:0;background:#fff;border-radius:50%;width:42px;height:42px;box-shadow:0 2px 8px #0003;font-size:21px}.p1{top:28%;left:56%}.p2{top:48%;left:28%}.p3{top:65%;left:68%}.loc{position:absolute;top:50%;left:50%;width:16px;height:16px;background:#2585ff;border:3px solid white;border-radius:50%}.btn{border:0;border-radius:13px;padding:13px 16px;background:var(--g);color:#fff;font-weight:700}.full{width:100%}.scan{height:58vh;background:#111;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;position:relative}.frame{width:78%;height:45%;border:2px solid white;border-radius:12px}.scan-actions{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-around;align-items:center}.camera{width:68px;height:68px;border-radius:50%;background:var(--g);border:5px solid white;display:grid;place-items:center;font-size:27px}.hidden{display:none}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.detail-hero{height:150px;border-radius:20px;background:#e4f1e6;display:grid;place-items:center;font-size:58px}.empty{text-align:center;color:var(--muted);padding:30px}
</style></head><body><div class="app">
<section id="home" class="screen active"><header><div><div class="meta">📍 София</div><h1>Колко струва?</h1></div>🔔</header><input id="search" class="search" placeholder="Търси заведение, продукт, кухня..."><div class="chips" id="chips"></div><div style="display:flex;justify-content:space-between"><h2>Заведения около теб</h2><span class="meta">Виж всички</span></div><div id="venues"></div></section>
<section id="map" class="screen"><header><h1>Карта</h1><button class="btn" onclick="locate()">📍 Моето място</button></header><div class="map"><div class="road r1"></div><div class="road r2"></div><button class="pin p1" onclick="openVenue(0)">☕</button><button class="pin p2" onclick="openVenue(1)">🍕</button><button class="pin p3" onclick="openVenue(2)">🍺</button><div class="loc"></div></div></section>
<section id="add" class="screen"><header><h1>Добави цена</h1></header><div class="scan"><div class="frame"></div><div style="margin-top:18px">Насочи камерата към менюто</div><div class="scan-actions"><label>🖼️<input id="photo" class="hidden" type="file" accept="image/*" capture="environment"></label><label class="camera">📷<input class="hidden" type="file" accept="image/*" capture="environment"></label><button style="background:none;border:0;color:white" onclick="manual()">⌨️<br>Въвеждане</button></div></div><div id="scanResult"></div></section>
<section id="compare" class="screen"><header><h1>Сравни цени</h1></header><input id="productSearch" class="search" placeholder="Например: бира, кафе, салата..." oninput="compare()"><div id="comparison"></div></section>
<section id="profile" class="screen"><header><h1>Профил</h1></header><div class="card" style="text-align:center;padding:30px"><div style="font-size:60px">👤</div><h2>Моят профил</h2><p class="meta">Запазвай любими заведения и добавяй актуални цени.</p><button class="btn">Вход / Регистрация</button></div></section>
<section id="detail" class="screen"><header><button class="btn" onclick="show('home')">← Назад</button>♡</header><div id="detailContent"></div></section>
<nav class="bottom"><button class="nav active" data-tab="home" onclick="show('home')"><b>⌂</b>Начало</button><button class="nav" data-tab="map" onclick="show('map')"><b>⌖</b>Карта</button><button class="nav" data-tab="add" onclick="show('add')"><b>＋</b>Добави</button><button class="nav" data-tab="compare" onclick="show('compare')"><b>⇄</b>Сравни</button><button class="nav" data-tab="profile" onclick="show('profile')"><b>♙</b>Профил</button></nav></div>
<script>
const venues=[{name:'Café Central',cat:'Кафене',address:'ул. Граф Игнатиев 12, София',rating:4.6,reviews:128,distance:120,level:'€€',icon:'☕',items:[['Еспресо','Кафе и напитки',2],['Капучино','Кафе и напитки',3.2],['Лате','Кафе и напитки',3.5],['Фрапе','Кафе и напитки',3],['Чай','Кафе и напитки',2.5],['Кока-Кола 330ml','Безалкохолни',2.5],['Минерална вода 500ml','Безалкохолни',1.5],['Загорка 500ml','Бира',3.5],['Шопска салата','Салати',7.5]]},{name:'Pizza Time',cat:'Пицария',address:'бул. Витоша 45, София',rating:4.3,reviews:96,distance:250,level:'€€',icon:'🍕',items:[['Маргарита','Пици',9.9],['Пеперони','Пици',12.9],['Цезар','Салати',8.9]]},{name:'Happy Bar',cat:'Бар',address:'бул. Дондуков 18, София',rating:4.2,reviews:75,distance:350,level:'€',icon:'🍺',items:[['Бира 500ml','Бира',3.2],['Кола 330ml','Безалкохолни',2.2]]},{name:'Механа София',cat:'Механа',address:'ул. Раковски 90, София',rating:4.5,reviews:210,distance:450,level:'€€€',icon:'🍽️',items:[['Шопска салата','Салати',8.5],['Кебапче','Основни',2.8]]}];
const cats=['Всички','Ресторанти','Кафенета','Барове','Пицарии'];document.getElementById('chips').innerHTML=cats.map((x,i)=>`<button class="chip ${i?'':'active'}" onclick="filterCat('${x}',this)">${x}</button>`).join('');
function render(list=venues){document.getElementById('venues').innerHTML=list.map(v=>`<div class="card venue" onclick="openVenue(${venues.indexOf(v)})"><div class="thumb">${v.icon}</div><div style="flex:1"><b>${v.name}</b><div class="meta">${v.cat}</div><div class="meta"><span class="star">★</span> ${v.rating} (${v.reviews}) · ${v.distance} м</div></div><div><b>${v.level}</b><div class="verified">●</div></div></div>`).join('')};
function filterCat(c,el){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');render(c==='Всички'?venues:venues.filter(v=>v.cat===({Кафенета:'Кафене',Пицарии:'Пицария',Барове:'Бар'}[c]||c)))}document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase();render(venues.filter(v=>(v.name+' '+v.cat+' '+v.items.map(x=>x[0]).join(' ')).toLowerCase().includes(q)))};
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.tab===id));if(id==='compare')compare()};function openVenue(i){let v=venues[i];let g={};v.items.forEach(x=>(g[x[1]]??=[]).push(x));document.getElementById('detailContent').innerHTML=`<div class="detail-hero">${v.icon}</div><div class="card"><h1>${v.name}</h1><div class="meta">${v.cat} · ${v.address}</div><p><span class="star">★</span> ${v.rating} (${v.reviews}) · ${v.level}</p><div class="verified">✓ Последна проверка на цените: 02.09.2026</div></div>${Object.entries(g).map(([c,a])=>`<div class="card"><b>${c}</b>${a.map(x=>`<div class="row"><span>${x[0]}</span><b>${x[2].toFixed(2)} €</b></div>`).join('')}</div>`).join('')}<button class="btn full" onclick="alert('Ще добавим редакция на цената в следващата версия.')">Цената е различна</button>`;show('detail')};
function compare(){let q=(document.getElementById('productSearch')?.value||'').toLowerCase(),rows=[];venues.forEach(v=>v.items.forEach(x=>{if(!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q))rows.push({v,x})}));rows.sort((a,b)=>a.x[2]-b.x[2]);document.getElementById('comparison').innerHTML=rows.map(r=>`<div class="card"><div style="display:flex;justify-content:space-between"><div><b>${r.x[0]}</b><div class="meta">${r.v.name}</div></div><b>${r.x[2].toFixed(2)} €</b></div></div>`).join('')||'<div class="empty">Няма намерени цени.</div>'};function locate(){navigator.geolocation?navigator.geolocation.getCurrentPosition(()=>alert('Локацията е разрешена за демонстрацията.'),()=>alert('Разреши Location в Safari.')):alert('Локацията не се поддържа.')}function manual(){let n=prompt('Име на продукт:','Капучино'),p=prompt('Цена в евро:','3.20');if(n&&p)document.getElementById('scanResult').innerHTML=`<div class="card"><b>Добавена позиция</b><div class="row"><span>${n}</span><b>${Number(p).toFixed(2)} €</b></div><button class="btn full">Потвърди</button></div>`}document.getElementById('photo').onchange=e=>{if(e.target.files[0])document.getElementById('scanResult').innerHTML='<div class="card"><b>Менюто е заснето ✓</b><p class="meta">В следващата версия ще извличаме автоматично продуктите и цените от снимката.</p></div>'};render();compare();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
